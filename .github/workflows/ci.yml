# ci.yml - continuous integration and release automation for paxsy.
#
# The build job compiles the toolchain on Ubuntu with two compilers and
# runs the Python end-to-end suite against the freshly built binary.
# The release job triggers on version tags, rebuilds, and publishes a
# source archive with the release notes.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: build-and-test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Build with ${{ matrix.cc }}
        run: make CC=${{ matrix.cc }}

      - name: End-to-end test suite
        run: make test

      - name: Verify the standard library
        run: ./paxsy check std

      - name: Upload the binary
        uses: actions/upload-artifact@v4
        with:
          name: paxsy-${{ matrix.cc }}
          path: paxsy

  release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package the source archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          git archive --format=tar.gz \
            --prefix="paxsy-${VERSION}/" \
            -o "paxsy-${VERSION}.tar.gz" "$GITHUB_REF_NAME"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: paxsy-*.tar.gz
          generate_release_notes: true
